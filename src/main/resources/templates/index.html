<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('CTR World Tour')"></head>

<body class="main">

<main class="menu-container">
    <div class="logo-container">
    <img src="../images/world-tour.png"  alt="logo" class="logo"/>
    </div>

    <div class="card">
        <h2>FOR SUMMER</h2>
        <form th:action="@{/start/prelim}" method="post">
            <button type="submit" class="menu-button">Preliminaries</button>
        </form>
    </div>

    <div class="card">
        <h2>FOR WINTER</h2>
        <form th:action="@{/start/main}" method="post">
            <button type="submit" class="menu-button">Main Event</button>
        </form>
    </div>
</main>
